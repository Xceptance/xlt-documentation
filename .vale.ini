StylesPath = styles
MinAlertLevel = suggestion

Packages = Google, write-good

Vocab = XLT

[*.{md,mdx}]
BasedOnStyles = Vale, Google, write-good

# Calibrate rule severity for technical documentation corpus
Google.Latin = suggestion
Google.Quotes = suggestion
Google.EmDash = suggestion
Google.Units = suggestion
Google.Spacing = warning
Google.Ordinal = suggestion
Google.Exclamation = warning
Google.OptionalPlurals = suggestion
Google.LyHyphens = suggestion
Google.DateFormat = suggestion
write-good.So = suggestion
write-good.ThereIs = warning

BlockIgnores = (?s)(^---$.*?^---$), \
               (?s)(^:::[a-z]+(\[.*?\])?$.*?^:::$)

TokenIgnores = (`[^`]+`), \
               (\]\([^\)]+\)), \
               (https?://[^\s\)]+)
