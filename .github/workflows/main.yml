name: Deploy documentation

on:
  push:
    branches: 
      - main # Set a branch to deploy
  workflow_dispatch:
  
# Prevent concurrent deployments across ALL branches/runs of this workflow.
# New runs will wait (queue) until the current one finishes.
concurrency:
  group: deploy-documentation
  cancel-in-progress: false
    
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run validate

      - name: Build static documentation
        run: npm run build

      - name: Install lftp
        run: sudo apt-get install lftp

      - name: Mirror the documentation on the FTP 
        run: .github/workflows/scripts/mirrorftp ${{ secrets.FTP_USERNAME }} ${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_HOST }}
